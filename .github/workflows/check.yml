name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # macOS: package.json declares os=darwin, and the dialog tests use the
    # runner's installed Google Chrome (no browser download).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test
